name: Developer examples
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [creator-shortlist, workflows]
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          package_json_file: ${{ matrix.example }}/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: pnpm
          cache-dependency-path: ${{ matrix.example }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test
      - if: matrix.example == 'creator-shortlist'
        run: pnpm build

  creator-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
      - run: node --test tests/creator-research.test.mjs
